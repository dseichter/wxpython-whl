name: Build and Release Wheel

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13'] # Define Python versions to build for
    outputs:
      wx_version: ${{ steps.get_wx_version.outputs.wx_version }}
      python_version_no_dots: ${{ steps.strip_python_version.outputs.python_version_no_dots }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Update distribution
      run: sudo apt-get update && sudo apt-get upgrade -y

    - name: Install dependencies
      run: sudo apt-get install build-essential libgtk-3-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create and start virtual environment
      run: |
        python3 -m venv venv
        source venv/bin/activate

    - name: Strip Python version dots
      id: strip_python_version
      run: |
        NO_DOTS=$(echo "${{ matrix.python-version }}" | tr -d '.')
        echo "python_version_no_dots=$NO_DOTS" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install six wheel setuptools

    - name: Download wxPython
      run: |
        pip download -r requirements.txt

    - name: Get version of wxPython out of requirements.txt
      id: get_wx_version
      run: |
        echo "wx_version=$(cat requirements.txt | grep wxPython | cut -d'=' -f3)" >> $GITHUB_OUTPUT

    - name: Build wheel
      run: |
        pip wheel -v wxPython-${{ steps.get_wx_version.outputs.wx_version }}.tar.gz -w dist/

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wxPython-${{ steps.get_wx_version.outputs.wx_version }}-cp${{ steps.strip_python_version.outputs.python_version_no_dots }}-cp${{ steps.strip_python_version.outputs.python_version_no_dots }}-linux_x86_64.whl
        path: dist/wxpython-${{ steps.get_wx_version.outputs.wx_version }}-cp${{ steps.strip_python_version.outputs.python_version_no_dots }}-cp${{ steps.strip_python_version.outputs.python_version_no_dots }}-linux_x86_64.whl

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts for Python 3.12
        uses: actions/download-artifact@v6
        with:
          name: wxPython-${{ needs.build.outputs.wx_version }}-cp312-cp312-linux_x86_64.whl

      - name: Download artifacts for Python 3.13
        uses: actions/download-artifact@v6
        with:
          name: wxPython-${{ needs.build.outputs.wx_version }}-cp313-cp313-linux_x86_64.whl

      - name: List downloaded files
        run: ls -l

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.wx_version }}
          name: wxPython-${{ needs.build.outputs.wx_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            wxpython-${{ needs.build.outputs.wx_version }}-cp312-cp312-linux_x86_64.whl
            wxpython-${{ needs.build.outputs.wx_version }}-cp313-cp313-linux_x86_64.whl
